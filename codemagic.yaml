workflows:
  capacitor-android:
    name: BHAVISHYAA Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Verify Node version
        script: |
          node -v
          npm -v
      - name: Install npm dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - rdp5rss@gmail.com
        notify:
          success: true
          failure: true
